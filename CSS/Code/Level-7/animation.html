<!DOCTYPE html>
<html lang="en">
<head>
    <title>Key-Frame</title>
    <style>
        .box {
            height: 75px;
            width: 75px;
            border: 1px solid black;
            border-radius: 5px;
            position: absolute;
            left: 10;
            background-color: lime;

            /* animation-name: animation;
            animation-duration: 4s;
            animation-timing-function: ease-in-out;
            animation-delay: 0s;
            animation-iteration-count: 4;
            animation-direction: alternate; */ 
            
            animation: animation 4s ease-in-out 0s 4 alternate;
        }

        @keyframes animation {
            0% {
                left: 10px;
                top: 0px;
            }
            50% {
                left: 150px;
                top: 100px;
            }
            100% {
                left: 300px;
                top: 0px;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
