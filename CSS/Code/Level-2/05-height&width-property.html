<!DOCTYPE html>
<html lang="en">
<head>
    <title>Height&Width</title>
    <style>
        .box {
            width: 40px;
            height: 40px;
        } 
        #box1{ background-color: red; }
        #box2 { background-color: blue; }
        #box3 { background-color: green; }
    </style>
</head>
<body>
    <div id="box1" class="box">Box 1</div>
    <br>
    <div id="box2" class="box">Box 2</div>
    <br>
    <div id="box3" class="box">Box 3</div>
</body>
</html>
