<!DOCTYPE html>
<html lang="en">
<head>
    <title>convert Celsius to Fahrenheit</title>
</head>
<body>
    <!-- Create Method to convert Celsius to 
    Fahrenheit F = (9/5) * C + 32 -->
    <script>
        function toFahrenheit(CelsiusValue) {
            return 9/5 * CelsiusValue + 32
        } 

        console.log(toFahrenheit(38));
        console.log(toFahrenheit(0));
        console.log(toFahrenheit(100));
    </script>
</body>
</html>
