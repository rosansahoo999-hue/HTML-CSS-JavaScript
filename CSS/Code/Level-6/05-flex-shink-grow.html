<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flex-Container</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box {
            height: 100px;
            width: 100px;
            border: 3px solid black;
            margin-right: 5px;
        }
        #heading {
            margin-left: 200px;
        }
        #container {
            height: 150px;
            width: 350px;
            padding: 10px;
            margin: 20px;
            border: 3px solid black;
            display: flex;

            flex-direction: row-reverse;
        }
        #container-1 {
            height: 150px;
            width: 535px;
            padding: 10px;
            margin: 20px;
            border: 3px solid black;
            display: flex;

            
        }
        #box1 {
            background-color: aqua;
        }
        #box2 {
            background-color: blueviolet;
        }
        #box3 {
            background-color: yellow;
            flex-shrink: 4;
        }
        #box4 {
            background-color: tomato;
        }
        #box5 {
            background-color: yellow;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <h1 id="heading">Flex-Container</h1>
    <div id="container">
        <div id="box1" class="box">Flex Item 1</div>
        <div id="box2" class="box">Flex Item 2</div>
        <div id="box3" class="box">Flex Item 3</div>
        <div id="box4" class="box">Flex Item 4</div>
    </div>
    <div id="container-1">
        <div id="box1" class="box">Flex Item 1</div>
        <div id="box2" class="box">Flex Item 2</div>
        <div id="box5" class="box">Flex Item 3</div>
        <div id="box4" class="box">Flex Item 4</div>
    </div>
</body>
</html>
