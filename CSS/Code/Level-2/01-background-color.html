<!DOCTYPE html>
<html lang="en">
<head>
    <title>Background-Color</title>
    <style>
        #first {
            color: black;
            background-color: red;
            width: 50%;
        }
        #second {
            color: black;
            background-color: green;
            width: 50%;
        }
        button {
            color: black;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div id="first">First</div>
    <div id="second">Second</div>
    <button>Click Me</button>
</body>
</html>
