<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Game</title>
    <link rel="stylesheet" href="cricket.css">
</head>
<body>
    <h1>Bat Ball Stump Game</h1>
    <button class="choice-button" onclick=" 
    generateComputerChoice();
    let resultMsg = getResult('Bat', computerChoice);
    showResult('Bat', computerChoice, resultMsg)
    ">
    <img src="./images/bat.png" alt="bat images" class="choice-image">
    </button>

    <button class="choice-button" onclick="
    // This will generate random number between 0 and 3.
    generateComputerChoice();
    resultMsg = getResult('Ball', computerChoice);
    showResult('Ball', computerChoice, resultMsg)
    ">
    <img src="./images/ball.png" alt="ball images" class="choice-image">
    </button>

    <button class="choice-button" onclick="
    // This will generate random number between 0 and 3.
    generateComputerChoice();
    resultMsg = getResult('Stump', computerChoice);
    showResult('Stump', computerChoice, resultMsg);
    ">
    <img src="./images/stump.png" alt="stump images" class="choice-image">
    </button>

    <h3 id="user-move"></h3>
    <h3 id="computer-move"></h3>
    <h3 id="result"></h3>
    <h3 id="score"></h3>

    <button onclick="localStorage.clear() 
        resetScore();
    ">Reset</button>

    <script>
        let scoreStr = localStorage.getItem('Score');
        let score;
        resetScore(scoreStr);

        function resetScore(scoreStr) {
            score = scoreStr ? JSON.parse(scoreStr) : {
                win: 0,
                loss: 0,
                tie: 0,
            };
        score.displayScore = function() {
            return `Score:-  Won ${score.win}, Loss ${score.loss}, Tie ${score.tie}`;
        };

        showResult();
    };


        let computerChoice;
        function generateComputerChoice() {
            // This will generate random number between 0 and 3.
            let randomNumber = Math.random() * 3;
            if (randomNumber > 0 && randomNumber <= 1) {
            computerChoice = 'Bat';
            // console.log('computerChoice is Bat');
            } else if (randomNumber > 1 && randomNumber <= 2) {
            computerChoice = 'Ball';
            // console.log('computerChoice is Ball');
            } else {
            computerChoice = 'Stump';
            // console.log('computerChoice is Stump');
            }

        }

        function getResult(userMove, computerMove) {
            if (userMove === 'Bat') {
                if(computerMove === 'Ball') {
                    score.win++;
                    return 'User Won';
                } else if (computerMove === 'Bat') {
                    score.tie++;
                    return `it's tie`;
                } else {
                    score.loss++;
                    return 'Computer has Won';
                } 
            }
            else if (userMove === 'Ball') {
                if(computerMove === 'Ball') {
                    score.tie++;
                    return `it's tie`;
                } else if (computerMove === 'Bat') {
                    score.loss++;
                    return 'Computer has Won';
                } else if(computerMove === 'Stump') {
                    score.win++;
                    return 'User Won';
                }
            }
            else {
                if(computerMove === 'Ball') {
                    score.loss++;
                    return 'Computer has Won';
                } else if (computerMove === 'Bat') {
                    score.win++;
                    return 'User Won';
                } else if(computerMove === 'Stump') {
                    score.tie++;
                    return `it's tie`;
                }
            }
        }

            function showResult(userMove, computerMove, result) {
                localStorage.setItem('Score', JSON.stringify(score));
                
                document.querySelector('#user-move').innerText = 
                userMove !== undefined ? `you have chosen ${userMove}` : '';
                
                document.querySelector('#computer-move').innerText = 
                computerMove ? `computer choice is ${computerMove}` : '';
                
                document.querySelector('#result').innerText = result || '';

                document.querySelector('#score').innerText = score.displayScore();
                // console.log(score);
            }
    </script>
</body>
</html>
