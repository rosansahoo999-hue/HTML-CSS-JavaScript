<!DOCTYPE html>
<html lang="en">
<head>
    <title>Text-Transform</title>
    <style>
        #box1 {
            text-transform: uppercase;
        } 
        #box2 {
            text-transform: lowercase;
        } 
        #box3 {
            text-transform: capitalize;
        } 
        #box4 {
            text-transform: none;
        } 
    </style>
</head>
<body>
    <h3 id="box1">first box</h3>
    <h3 id="box2">SECOND BOX</h3>
    <h3 id="box3">third box</h3>
    <h3 id="box4">Fourth box</h3>
</body>
</html>
