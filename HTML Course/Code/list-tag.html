<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OL / UL List</title>
</head>
<body>
    <div>
    <ol>
        <li>Wake Up</li>
        <li>Brush Teeth</li>
    </ol>
    <ol type="A">
        <li>take a shower</li>
        <li>Have Breakfast</li>
    </ol>
    <ol type="a">
        <li>Go to Work</li>
        <li>Come to Home</li>
    </ol>
    <ol type="I">
        <li>Apple</li>
        <li>Banana</li>
    </ol>
    <ol type="i">
        <li>Cherry</li>
        <li>Dragonfruit</li>
    </ol>
    </div>
    <div>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Cherry</li>
        </ul>
        <ul type="square">
            <li>Apple</li>
            <li>Banana</li>
            <li>Cherry</li>
        </ul>
    </div>
</body>
</html>
