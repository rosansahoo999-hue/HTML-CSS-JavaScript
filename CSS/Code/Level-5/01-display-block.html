<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display-Block</title>
    <style>
        .box {
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            margin: 10px;
            text-align: center;
            border: 5px solid black;
            border-radius: 10px;
            display: block;
        } 
    </style>
</head>
<body>
    <div>
        <div id="box1" class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
        <div id="box3" class="box">Box3</div>
    </div>
</body>
</html>
