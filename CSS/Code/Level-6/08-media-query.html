<!DOCTYPE html>
<html lang="en">
<head>
    <title>media-query</title>
    <style>
        .box {
            height: 100px;
            width: 100px;
            background-color: lightsalmon;
        } 
        @media screen and (min-width: 250px) and (max-width: 300px){
            .box {
                border: 5px solid red;
            } 
        }   
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
