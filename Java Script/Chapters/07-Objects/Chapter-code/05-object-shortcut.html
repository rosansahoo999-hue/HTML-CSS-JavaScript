<!DOCTYPE html>
<html lang="en">
<head>
    <title>Object-Shortcuts</title>
</head>
<body>
    <script>
        let product = {
            company: 'Mango',
            price: 861,
            'Item-name': 'T-shirt',
        };
        
        let {company, price} = product;
        console.log(company);
        console.log(price);
    </script>
</body>
</html>
