<!DOCTYPE html>
<html lang="en">
<head>
    <title>setInterval</title>
</head>
<body>
    <script>
        let alaram = () => console.log(`subha ho gayi, uth jaao. ${new Date()}`);
        // setInterval(alaram, 2000);

        let intervalId = setInterval(alaram, 1000);
        setTimeout(() => clearInterval(intervalId), 5000);
    </script>
</body>
</html>
