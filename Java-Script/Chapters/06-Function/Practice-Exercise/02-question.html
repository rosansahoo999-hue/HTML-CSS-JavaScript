<!DOCTYPE html>
<html lang="en">
<head>
    <title>Larger</title>
</head>
<body>
    <!-- Create a method to return larger of the two 
    numbers. -->
    <script>
        function larger(num1, num2) {
            // if (num1 > num2) {
            //     return num1
            // } else {
            //     return num2
            // }  

            return num1 > num2 ? num1 : num2
        } 
        
        console.log(larger(4, 5));
        console.log(larger(6, 6));
        console.log(larger(444, 145));
    </script>
</body>
</html>
