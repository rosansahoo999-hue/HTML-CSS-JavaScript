<!DOCTYPE html>
<html lang="en">
<head>
    <title>If Alternative</title>
</head>
<body>
    <script>
        // Ternary operator
        let age = 31;
        // let result;
        // if (age > 18) {
        //     result = "Adult";
        // } else {
        //     result = "Kids"
        // } 
        let result = age >= 18 ? "Adult" : "Kids"
        console.log(result);

        // Guard Operator
        let ageN = 0;
        let finalAge = ageN || 18;
        console.log(ageN);
        console.log(finalAge);

        // Default Operator
        let ageDfl;
        let finalAgeDfl = ageDfl ?? 18;
        console.log(ageDfl);
        console.log(finalAgeDfl);
    </script>
</body>
</html>
