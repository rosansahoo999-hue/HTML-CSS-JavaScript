<!DOCTYPE html>
<html lang="en">
<head>
    <title>Visibility</title>
    <style>
        .box {
            height: 40px;
            width: 40px;
        } 
        #box1 {
            background-color: red;
            visibility: visible;
        } 
        #box2 {
            background-color: green;
            visibility: hidden;
        } 
    </style>
</head>
<body>
    <div id="box1" class="box">Box 1</div>
    <div id="box2" class="box">Box 2</div>
</body>
</html>
