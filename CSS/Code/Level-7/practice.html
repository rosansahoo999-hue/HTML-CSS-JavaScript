<!DOCTYPE html>
<html>
<head>
<style>
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f0f13;
  font-family:sans-serif;
}
.container{
  width:400px;
  padding:40px;
  background:#18181f;
  border-radius:20px;
}
.progress-track{
  width:100%;
  height:14px;
  background:#24242f;
  border-radius:100px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, #7c3aed, #ec4899);
  border-radius:100px;
  animation: loading 3s ease-in-out forwards,
             bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 3s forwards;
  transform-origin:left center;
}

/* 0 to 100% smooth fill */
@keyframes loading{
  0%{ width:0%; }
  100%{ width:100%; }
}

/* Slight bounce when it hits 100% */
@keyframes bounce{
  0%{ transform:scaleX(1) scaleY(1); }
  30%{ transform:scaleX(1.08) scaleY(1.3); }
  50%{ transform:scaleX(0.95) scaleY(0.9); }
  70%{ transform:scaleX(1.03) scaleY(1.1); }
  100%{ transform:scaleX(1) scaleY(1); }
}
</style>
</head>
<body>

<div class="container">
  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>
</div>

</body>
</html>
