<!DOCTYPE html>
<html lang="en">
<head>
    <title>Transform Rotate</title>
    <style>
        .box {
            height: 50px;
            width: 50px;
            padding: 5px;
            margin: 20px;
            border: 1px solid black;
            border-radius: 5px;
            transition-property: all;
            transition-duration: 1s;
            transition-timing-function: ease-in-out;
            cursor: pointer;
        } 
        #box1 {
            background-color: lime;
        }
        #box1:hover {
            transform: rotate(45deg);
        } 
        #box2 {
            background-color: blueviolet;
        } 
        #box2:hover {
            transform: rotate(180deg);
        } 
        #box3 {
            background-color: indianred;
        } 
        #box3:hover {
            transform: rotatex(45deg);
        } 
        #box4 {
            background-color: violet;
        } 
        #box4:hover {
            transform: rotateY(45deg);
        } 
    </style>
</head>
<body>
    <div class="box" id="box1">45<sup>deg</sup></div>
    <div class="box" id="box2">180<sup>deg</sup></div>
    <div class="box" id="box3">x 45<sup>deg</sup></div>
    <div class="box" id="box4">y 45<sup>deg</sup></div>
</body>
</html>
