<!DOCTYPE html>
<html lang="en">
<head>
    <title>Transform Scale</title>
    <style> 
        .box {
            height: 50px;
            width: 50px;
            padding: 5px;
            margin: 50px;
            border: 1px solid black;
            border-radius: 5px;
            cursor: pointer;
            transition-property: all;
            transition-duration: 1s;
            transition-timing-function: ease-in-out;
        } 
        #box1 {
            background-color: lime;
        } 
        #box1:hover {
            transform: scale(2);
        } 
        #box2 {
            background-color: blueviolet;
        } 
        #box2:hover {
            transform: scale(4);
        } 
        #box3 {
            background-color: indianred;
        }
        #box3:hover {
            transform: scaleX(2);
        } 
        #box4 {
            background-color: violet;
        } 
        #box4:hover {
            transform: scaleY(2);
        } 
    </style>
</head>
<body>
    <div class="box" id="box1">Scale Twice</div>
    <div class="box" id="box2">Scale 4 Times</div>
    <div class="box" id="box3">Scale X Twice</div>
    <div class="box" id="box4">Scale Y Twice</div>
</body>
</html>
