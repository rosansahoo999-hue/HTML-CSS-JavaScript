<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice-Exercise</title>
</head>
<body>
    <!-- Create a method to check if a number is odd 
    or even -->
    <script>
        function isOdd(number){
            let rem = number % 2
            let isOdd = rem == 1;
            return isOdd;
        } 

        console.log(isOdd(4));
        console.log(isOdd(5));
        console.log(isOdd(0));
        console.log(isOdd(999));
    </script>
</body>
</html>
