<!DOCTYPE html>
<html lang="en">
<head>
    <title>setTimeout</title>
</head>
<body>
    <script>
        let alarm = function() {
            console.log("subaha ho gayi, uth jaao..")
        } 
        let timerId = setTimeout(alarm, 2000);
        console.log(`Alaram Set with timerId: ${timerId}`);
        clearTimeout(timerId);
    </script>
</body>
</html>
