<!DOCTYPE html>
<html lang="en">
<head>
    <title>Text-Align</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
        }
        #box1 {
            background-color: red;
            text-align: left;
        }
        #box2 {
            background-color: green;
            text-align: center;
        }
        #box3 {
            background-color: blue;
            text-align: right;
        }
    </style>
</head>
<body>
    <h3 id="box1" class="box">Box1</h3>
    <h3 id="box2" class="box">Box2</h3>
    <h3 id="box3" class="box">Box3</h3>
</body>
</html>
