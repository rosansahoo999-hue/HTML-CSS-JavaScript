<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tag</title>
</head>
<body>
    <table border="1">
        <caption>Student Information</caption>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>Rosan</td>
            <td>24</td>
            <td>rosan999@gmail.com</td>
        </tr>
        <tr>
            <td colspan="3">This is cell span 3 columns</td>
        </tr>
    </table>
</body>
</html>
