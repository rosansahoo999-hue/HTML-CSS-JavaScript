<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice-Exercise</title>
    <style>
        body {
            text-align: center;
        }
        #my-button {
            height: 50px;
            width: 50px;
            font-size: 25px;
            border: none;
            border-radius: 5px;
        }
        .js-odd {
            background-color: chocolate;
        }
        .js-even {
            background-color: lawngreen;
        }
    </style>
</head>
<body>
    <!-- 1. Display good morning, afternoon and night based on 
current hour.
2. Add the name to the output too.
3. Create a Button which shows the number how many times 
it has been pressed. 
• Also, it has different colors for when it has been pressed 
odd or even times.
• The click count should also survive browser refresh -->
    <h3 id="greeting"></h3>

    <button id="my-button" onclick="buttonPressed();"></button>
    <button onclick="localStorage.clear();">Reset</button>

<script>
    let noOfTimesClicked = localStorage.getItem('noOfTimesClicked') || 0;

    function buttonPressed() {
        noOfTimesClicked++;
        localStorage.setItem('noOfTimesClicked', noOfTimesClicked);
        updateButton();     
    } 

    function updateButton() {
        let button = document.querySelector('#my-button');
        if (noOfTimesClicked % 2 === 0) {
            button.classList.remove('js-odd');
            button.classList.add('js-even');
        } else {
            button.classList.remove('js-even');
            button.classList.add('js-odd');
        }
        button.innerText = noOfTimesClicked;
    }

    updateButton();


    function doGreeting(personName = 'Dear') {
        let date = new Date();
        let hours = date.getHours();
        let heading = document.querySelector('#greeting')
        console.log(date);
        console.log(hours);
        if (hours > 5 && hours < 12) { 
            heading.innerText = `good morning ${personName}`;
        } else if (hours > 12 && hours < 18) {
            heading.innerText = `good afternoon ${personName}`;
        } else {
            heading.innerText = `good night ${personName}`;
        } 
    } 
    doGreeting('Rosan');
</script>
</body>
</html>
